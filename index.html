<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Write All Class Name And Design Table</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <h1>Bootstrap Class Reference</h1>
  <p>Write All Class Name And Design Table — a searchable reference of common Bootstrap utility classes.</p>
  <input type="search" id="search" placeholder="Filter by class name, category or description…" />
</header>

<main class="container">
  <table id="classTable">
    <thead>
      <tr>
        <th>Category</th>
        <th>Class Name</th>
        <th>Description</th>
        <th>Example</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <p id="emptyState" class="empty hidden">No classes match your search.</p>
</main>

<script src="script.js"></script>
</body>
</html>
